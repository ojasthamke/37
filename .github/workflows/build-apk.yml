name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          import base64
          import os
          keystore_b64 = os.environ.get('KEYSTORE_BASE64', '')
          print(f"KEYSTORE_BASE64 secret length: {len(keystore_b64)}")
          clean_b64 = "".join(keystore_b64.split())
          print(f"Cleaned base64 length: {len(clean_b64)}")
          if not clean_b64:
              print("WARNING: KEYSTORE_BASE64 is empty! Build will fail.")
          try:
              decoded = base64.b64decode(clean_b64)
              print(f"Decoded bytes length: {len(decoded)}")
              if len(decoded) > 0:
                  print(f"Decoded header hex: {decoded[:10].hex().upper()}")
              with open('android/app/orderkart-release.jks', 'wb') as f:
                  f.write(decoded)
              print("Decoded keystore written successfully.")
          except Exception as e:
              print(f"Error decoding base64: {e}")
        shell: python

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=orderkart-release.jks
          EOF

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aplibhaji-admin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
